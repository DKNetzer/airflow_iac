# DDL Section 8: Airflow configuration
executor: "KubernetesExecutor"

# 1. Database Connection
postgresql:
  enabled: false

data:
  metadataSecretName: "airflow-db-password"

externalDatabase:
  type: postgres
  host: "127.0.0.1" 
  port: 5432
  database: "airflow"
  user: "airflow"
  passwordSecretName: "airflow-db-password"
  passwordSecretKey: "password"

# 2. Component Specific Configs
# Each component must have its own proxy to talk to the DB at 127.0.0.1
scheduler:
  extraContainers:
    - name: cloud-sql-proxy
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.1.0
      args: ["--private-ip", "jutomate-playground:us-central1:dkn-airflow-db"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532

webserver:
  extraContainers:
    - name: cloud-sql-proxy
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.1.0
      args: ["--private-ip", "jutomate-playground:us-central1:dkn-airflow-db"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532

# This fixes the "1/1" issue for the migration job
migrateDatabaseJob:
  extraContainers:
    - name: cloud-sql-proxy
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.1.0
      args: ["--private-ip", "jutomate-playground:us-central1:dkn-airflow-db"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532

# This fixes the user creation job
createUserJob:
  extraContainers:
    - name: cloud-sql-proxy
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.1.0
      args: ["--private-ip", "jutomate-playground:us-central1:dkn-airflow-db"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532

# 3. Security & Workload Identity
serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: "dkn-airflow-sa@jutomate-playground.iam.gserviceaccount.com"

# 4. GitHub Integration
dags:
  gitSync:
    enabled: true
    repo: "git@github.com:DKNetzer/airflow_iac.git"
    branch: "dev"
    subPath: "dags"
    sshKeySecret: "airflow-ssh-git"

# 5. Webserver Config
webserverSecretKey: "89898989898989898989898989898989"