# ── Executor ──────────────────────────────────────────────────────────────────
executor: "KubernetesExecutor"

# ── Disable bundled Postgres ──────────────────────────────────────────────────
postgresql:
  enabled: false

# ── DB connection via password ────────────────────────────────────────────────
data:
  metadataConnection:
    user: airflow
    pass: AirflowPoc2026
    host: 127.0.0.1
    port: 5432
    db: airflow
    sslmode: disable

# ── Remote logging to GCS ─────────────────────────────────────────────────────
config:
  logging:
    remote_logging: "True"
    remote_base_log_folder: "gs://dkn-airflow-logs-dev/logs"
    remote_log_conn_id: "google_cloud_default"

# ── Workload Identity service account ─────────────────────────────────────────
serviceAccount:
  create: true
  name: "airflow-worker"
  annotations:
    iam.gke.io/gcp-service-account: "dkn-airflow-worker@jutomate-playground.iam.gserviceaccount.com"

# ── Scheduler ─────────────────────────────────────────────────────────────────
scheduler:
  waitForMigrations:
    enabled: false
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
  extraContainers:
    - name: cloud-sql-proxy
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
      args:
        - "--private-ip"
        - "--port=5432"
        - "jutomate-playground:us-central1:dkn-airflow-pg-dev"
      resources:
        requests: { cpu: "50m", memory: "128Mi" }
        limits:   { cpu: "100m", memory: "256Mi" }
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false

# ── Webserver ─────────────────────────────────────────────────────────────────
webserver:
  waitForMigrations:
    enabled: false
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
  extraContainers:
    - name: cloud-sql-proxy
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
      args:
        - "--private-ip"
        - "--port=5432"
        - "jutomate-playground:us-central1:dkn-airflow-pg-dev"
      resources:
        requests: { cpu: "50m", memory: "128Mi" }
        limits:   { cpu: "100m", memory: "256Mi" }
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false

# ── Triggerer ─────────────────────────────────────────────────────────────────
triggerer:
  waitForMigrations:
    enabled: false
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
  extraContainers:
    - name: cloud-sql-proxy
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
      args:
        - "--private-ip"
        - "--port=5432"
        - "jutomate-playground:us-central1:dkn-airflow-pg-dev"
      resources:
        requests: { cpu: "50m", memory: "128Mi" }
        limits:   { cpu: "100m", memory: "256Mi" }
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false

# ── Workers (Spot instances) ──────────────────────────────────────────────────
workers:
  nodeSelector:
    cloud.google.com/gke-spot: "true"
  tolerations:
    - key: "cloud.google.com/gke-spot"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
  extraContainers:
    - name: cloud-sql-proxy
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
      args:
        - "--private-ip"
        - "--port=5432"
        - "jutomate-playground:us-central1:dkn-airflow-pg-dev"
      resources:
        requests: { cpu: "50m", memory: "128Mi" }
        limits:   { cpu: "100m", memory: "256Mi" }
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false

# ── Migration job ─────────────────────────────────────────────────────────────
migrateDatabaseJob:
  extraContainers:
    - name: cloud-sql-proxy
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
      args:
        - "--private-ip"
        - "--port=5432"
        - "jutomate-playground:us-central1:dkn-airflow-pg-dev"
      resources:
        requests: { cpu: "50m", memory: "128Mi" }
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false

# ── Create user job ───────────────────────────────────────────────────────────
createUserJob:
  extraContainers:
    - name: cloud-sql-proxy
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
      args:
        - "--private-ip"
        - "--port=5432"
        - "jutomate-playground:us-central1:dkn-airflow-pg-dev"
      resources:
        requests: { cpu: "50m", memory: "128Mi" }
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false

# ── Git-Sync DAG delivery ─────────────────────────────────────────────────────
dags:
  gitSync:
    enabled: true
    repo: "git@github.com:DKNetzer/airflow_iac.git"
    branch: "dev"
    subPath: "dags"
    sshKeySecret: "airflow-ssh-git"

# ── Disable local log PVCs ────────────────────────────────────────────────────
logs:
  persistence:
    enabled: false

webserverSecretKeySecretName: "airflow-webserver-secret-key"